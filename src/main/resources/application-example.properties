spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_inventory
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD

# Phase 4: Flyway owns the schema. Hibernate must never alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# The old data.sql seed script was replaced by V3__seed_product_catalog.sql,
# so script-based initialisation stays off permanently.
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

server.port=8080

app.jwt.secret=YOUR_JWT_SECRET_AT_LEAST_32_CHARACTERS_LONG
app.jwt.expiration=86400000

# Phase 4: media upload configuration.
# app.media.max-file-size-bytes is the limit the application enforces (2 MB).
# The container limits below are deliberately looser so that an oversized
# upload reaches MediaStorageService and is rejected with a descriptive
# message, rather than being cut off by Tomcat with a generic one.
app.media.upload-dir=uploads
app.media.public-base-path=/uploads
app.media.max-file-size-bytes=2097152

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=ecommerce-order-events
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s
